name: Pack m2 with trino and dependencies

on:
  workflow_dispatch:  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Build with Maven
      run: mvn -B -DskipTests install
      
    - name: Archive m2 repo
      uses: actions/upload-artifact@v4
      with:
        name: m2-repo
        path: ~/.m2/repository/io/trino/trino-iceberg/
        retention-days: 1
